name = "agentic-endpoints"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# ── Environment Variables ──────────────────────────────────────────
# Set these via `wrangler secret put <NAME>` for production,
# or in .dev.vars for local development.
#
# Required:
#   X402_PAY_TO        - Your wallet address (receives USDC on Base)
#   FACILITATOR_URL    - x402 facilitator endpoint (e.g. Coinbase CDP)
#
# Optional:
#   RECEIPT_SECRET     - HMAC key for signing JSON receipts

# ── Custom Domain ──────────────────────────────────────────────────
# Requires oliverkiss.com to be added to your Cloudflare account.
# Cloudflare will auto-provision SSL.
routes = [
  { pattern = "ai.oliverkiss.com/*", zone_name = "oliverkiss.com" }
]

[vars]
ENVIRONMENT = "development"

# ── Durable Objects ────────────────────────────────────────────────
[[durable_objects.bindings]]
name = "ONCE_KEY"
class_name = "OnceKey"

[[durable_objects.bindings]]
name = "VAULT"
class_name = "Vault"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OnceKey"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Vault"]
