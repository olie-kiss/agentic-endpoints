name = "agentic-endpoints"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# ── Environment Variables ──────────────────────────────────────────
# Set these via `wrangler secret put <NAME>` for production,
# or in .dev.vars for local development.
#
# Required:
#   X402_PAY_TO        - Your wallet address (receives USDC on Base)
#   RECEIPT_SECRET     - HMAC key for signing JSON receipts (>= 32 chars).
#                        Not optional: signReceipt throws without it, because
#                        an absent secret would sign with a known key.
#
# Optional:
#   ALERT_WEBHOOK_URL  - Discord-compatible webhook, posted to when USDC lands
#                        on the receiving address. Unset = monitoring still
#                        records revenue, it just cannot tell you about it.
#   BASE_RPC_URL       - Override the Base RPC used by the revenue monitor.
#   FACILITATOR_URL    - Override facilitator (defaults to https://facilitator.payai.network,
#                        a free public facilitator with no signup required).
#                        Must be a valid URL if set.

# ── Custom Domain ──────────────────────────────────────────────────
# Requires oliverkiss.com to be added to your Cloudflare account.
# Cloudflare will auto-provision SSL.
routes = [
  { pattern = "ai.oliverkiss.com/*", zone_name = "oliverkiss.com" }
]

# ── Observability ──────────────────────────────────────────────────
# Without this, console.error is written to a live `wrangler tail` and
# nowhere else: a cron that fails at 3am leaves no trace by morning. Sampling
# stays at 1.0 because this Worker's traffic is far below any volume where
# dropping logs would save meaningful money, and the rare failure is exactly
# the request we cannot afford to have sampled away.
[observability]
enabled = true
head_sampling_rate = 1

[vars]
ENVIRONMENT = "development"

# ── Revenue Monitoring ─────────────────────────────────────────────
# Watermark and rolling payment history for the on-chain USDC watcher.
[[kv_namespaces]]
binding = "MONITOR"
id = "18c22de5e5b846d4813431dcc92035e1"

# Base produces a block every ~2s; a 5-minute sweep stays far inside the
# eth_getLogs range cap while noticing a payment quickly enough to be useful.
[triggers]
crons = ["*/5 * * * *"]

# ── Durable Objects ────────────────────────────────────────────────
[[durable_objects.bindings]]
name = "ONCE_KEY"
class_name = "OnceKey"

[[durable_objects.bindings]]
name = "VAULT"
class_name = "Vault"

# One Durable Object per credit account, addressed by the token hash, so a
# balance check and its debit are atomic and accounts never queue behind
# each other.
[[durable_objects.bindings]]
name = "CREDITS"
class_name = "Credits"

# Service-wide demand counters. One instance, written after the response via
# waitUntil so measurement never sits in the request path.
[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

# One Durable Object per meeting-memory namespace. Transcripts are large and
# searched with FTS5, which wants them co-located with the index.
[[durable_objects.bindings]]
name = "MEETINGS"
class_name = "MeetingMemory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OnceKey"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Vault"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Credits"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Stats"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["MeetingMemory"]

# ── Rate Limiting ──────────────────────────────────────────────────
# Per-Cloudflare-location limits. Free endpoints are the abuse surface,
# since paid ones are already gated behind an on-chain payment.
[[ratelimits]]
name = "FREE_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60

# Vault writes consume durable storage, so they get a tighter budget.
[[ratelimits]]
name = "WRITE_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 20
  period = 60

# Customers who prepaid are not the abuse surface: their balance is itself a
# spend ceiling, so throttling them at the anonymous rate charged them for a
# restriction aimed at someone else. Only reachable after the ledger confirms
# a real, funded account.
[[ratelimits]]
name = "PAID_RATE_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 600
  period = 60

# ── Testnet Environment ────────────────────────────────────────────
# A throwaway deployment on Base Sepolia, used to prove settlement end to
# end without spending real USDC.
#
# It exists as a deployed Worker rather than `wrangler dev` because neither
# dev mode can run this service: local mode cannot make outbound TLS
# connections on some networks, and remote mode cannot run SQLite-backed
# Durable Objects at all.
#
# Separate KV, Durable Objects and rate-limit namespaces, so nothing here
# can touch production state. No custom route and no cron: it is reachable
# only on workers.dev, and the revenue monitor watches mainnet, which this
# deployment has nothing to say about.
[env.testnet]
name = "agentic-endpoints-testnet"
workers_dev = true
# Explicitly empty: top-level `routes` is inherited by every environment, so
# without this the testnet Worker tries to claim ai.oliverkiss.com.
routes = []

# Also inherited, and it matters: the revenue monitor writes its watermark
# to the MONITOR namespace shared with production. A second Worker sweeping
# mainnet on the same schedule would move production's watermark.
[env.testnet.triggers]
crons = []

[env.testnet.vars]
ENVIRONMENT = "testnet"
X402_NETWORK = "eip155:84532"
FACILITATOR_URL = "https://facilitator.payai.network"

[env.testnet.observability]
enabled = true
head_sampling_rate = 1

[[env.testnet.kv_namespaces]]
binding = "MONITOR"
id = "18c22de5e5b846d4813431dcc92035e1"

[[env.testnet.durable_objects.bindings]]
name = "ONCE_KEY"
class_name = "OnceKey"

[[env.testnet.durable_objects.bindings]]
name = "VAULT"
class_name = "Vault"

[[env.testnet.durable_objects.bindings]]
name = "CREDITS"
class_name = "Credits"

[[env.testnet.durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

# durable_objects is NOT inherited from the top level by environments, so a
# class added above is missing here and every call to it fails at runtime with
# no config error. Add new Durable Objects in BOTH places.
[[env.testnet.durable_objects.bindings]]
name = "MEETINGS"
class_name = "MeetingMemory"

[[env.testnet.migrations]]
tag = "v1"
new_sqlite_classes = ["OnceKey", "Vault", "Credits", "Stats"]

[[env.testnet.migrations]]
tag = "v2"
new_sqlite_classes = ["MeetingMemory"]

[[env.testnet.ratelimits]]
name = "FREE_RATE_LIMITER"
namespace_id = "2001"

  [env.testnet.ratelimits.simple]
  limit = 60
  period = 60

[[env.testnet.ratelimits]]
name = "WRITE_RATE_LIMITER"
namespace_id = "2002"

  [env.testnet.ratelimits.simple]
  limit = 20
  period = 60

[[env.testnet.ratelimits]]
name = "PAID_RATE_LIMITER"
namespace_id = "2003"

  [env.testnet.ratelimits.simple]
  limit = 600
  period = 60
